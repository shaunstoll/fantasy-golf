# Temporary probe: capture the datagolf live feed during play to determine
# what timezone tee-time strings in the `t` (thru) field are expressed in.
# Delete once the timezone question is answered.
name: probe-datagolf
on:
  push:
    branches:
      - claude/tournament-timezone-detection-3qqcgg
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch datagolf mini feed
        run: |
          echo "=== UTC now: $(date -u) ==="
          curl -sS "https://letzig.datagolf.com/live-model/get-main-data/mini" -o mini.json || echo "mini fetch failed"
          echo "=== info object ==="
          jq '.pga.info' mini.json || head -c 500 mini.json
          echo "=== entries with a colon in t (tee times) ==="
          jq '[.pga.lb[] | select(.t | tostring | contains(":"))] | .[0:15]' mini.json
          echo "=== named players ==="
          jq '[.pga.lb[] | select(.l == "Burns" or .l == "Fox" or .l == "DeChambeau" or .l == "Scheffler" or .l == "Kim" or .l == "Aberg")]' mini.json
          echo "=== top-level keys ==="
          jq 'keys' mini.json
          echo "=== pga keys ==="
          jq '.pga | keys' mini.json
      - name: Try fuller datagolf endpoints for timezone/course metadata
        run: |
          for path in "live-model/get-main-data/main" "live-model/get-main-data/full" "live-model/get-dg-model-data/mini"; do
            echo "=== $path ==="
            code=$(curl -sS -o out.json -w "%{http_code}" "https://letzig.datagolf.com/$path" || echo "ERR")
            echo "HTTP $code"
            if [ "$code" = "200" ]; then
              jq 'if type == "object" then keys else .[0:2] end' out.json | head -40
              jq '.. | objects | with_entries(select(.key | test("time|zone|course|loc|tz|city|country"; "i"))) | select(length > 0)' out.json 2>/dev/null | sort -u | head -30
            else
              head -c 300 out.json; echo
            fi
          done
