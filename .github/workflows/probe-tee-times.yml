# Temporary: exercise DataGolfClient against the live feed from a runner with
# open egress, to verify tee-time conversion end-to-end. Delete after use.
name: probe-tee-times
on:
  push:
    branches:
      - claude/tournament-timezone-detection-3qqcgg

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx src/scripts/probe-tee-times.ts
